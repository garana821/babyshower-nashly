services:
  babyshower:
    build: .
    container_name: babyshower-app
    ports:
      - "3000:5000"
    volumes:
      # Persists the JSON database across container updates and restarts
      - ./database:/usr/src/app/database
    environment:
      - PORT=5000
      - NODE_ENV=production
      # Uncomment and set these to protect the admin panel
      - ADMIN_USER=admin
      - ADMIN_PASSWORD=nashly11
    restart: unless-stopped
